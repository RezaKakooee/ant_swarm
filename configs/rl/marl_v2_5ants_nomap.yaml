# MARL v2 (chapter 04 lit review): centralised critic, contact-point velocity,
# parallel envs, optional warm start from the DAgger student, optional team-size
# staging. 5 ants spread, geodesic_exit reward, NO maze curriculum.
# Five ants spread over the T: 2 on the big cap, 2 on the small cap, 1 at the
# centre. Replaces the random-perimeter layout (seed 0 put all five on the big cap).
# Method 1: Perturbation-Augmented Imitation Learning (Augmented BC)
# Injects state perturbations and applies closed-loop corrective steering
# to eliminate compounding error without curriculum.

scene_scale: 1.0
world:
  width: 1.65
  height: 0.72
walls:
  x_columns:
  - 0.758
  - 0.979
  length: 0.285
  thickness: 0.01
  render_extra: 0.2
  height: 0.08
tshape:
  stem_len: 0.3315
  cap_big_len: 0.1748
  cap_small_len: 0.0874
  thickness: 0.027
  z: 0.02
  height: 0.04
goal:
  pos:
  - 1.2
  - 0.36
  reach_radius: 0.06
  random_box:
  - - 1.05
    - 0.1
  - - 1.55
    - 0.62
spawn:
  x_range:
  - 0.06
  - 0.52
  angle_range:
  - -3.14159265
  - 3.14159265
  margin: 0.06
  max_tries: 500
  resample_each_reset: true
ants:
  n: 5
  single_agent_spin: false
  # attachment points, T local frame (metres). Stem along x, origin at its centre;
  # big cap at x=-0.166 (spans y +-0.087), small cap at x=+0.166 (spans y +-0.044).
  offsets:
  - [-0.16575,  0.055]   # big cap, upper
  - [-0.16575, -0.055]   # big cap, lower
  - [ 0.16575,  0.028]   # small cap, upper
  - [ 0.16575, -0.028]   # small cap, lower
  - [ 0.0,      0.0  ]   # centre of the stem: pushes only, no torque
  radius: 0.005
  z: 0.04
  mass: 0.001
motion:
  mode: dynamic
  step_len: 0.01
  rot_step: 0.1
physics:
  push_strength: 0.0005
  object_mass: 0.5
  object_inertia: 0.01
  linear_friction: 0.96
  angular_friction: 0.94
  substeps: 10
  spin_strength: null
  boundary_margin: 0.025
  restitution_wall: -0.2
  restitution_bound: -0.15
env:
  max_steps: 500
  # Chapter 04 s15: NO geodesic (BFS) field. Euclidean progress toward the goal
  # plus the success bonus. progress_coef 1.0 (not 0.1) so the shaping per
  # episode (~1.2 m of progress) is on the scale of the geodesic reward (~1.0).
  reward_mode: shaped
  reward_progress_coef: 1.0
  reward_success: 1.0
  goal_track: big_cap
  observe_linear_velocity: true
  velocity_scale_ants: 1        # absolute velocity: the load's motion scales with the true team
  observe_contact_velocity: true  # each ant's own contact-point velocity (obs 27 -> 29)

# Team-size staging (chapter-04 lit review, item E): actor carried over, critic
# rebuilt. Off by default; enable with --stages on the command line.
stage_layouts:
  2:
  - [-0.16575, 0.0]
  - [ 0.16575, 0.0]
  3:
  - [-0.16575,  0.055]
  - [-0.16575, -0.055]
  - [ 0.16575,  0.0]
  5:
  - [-0.16575,  0.055]
  - [-0.16575, -0.055]
  - [ 0.16575,  0.028]
  - [ 0.16575, -0.028]
  - [ 0.0,      0.0  ]
